  <style>
    :root {
      --bg: #050b06;
      --bg-raised: rgba(11, 22, 16, 0.72);
      --text: #d7f5df;
      --muted: #7fb390;
      --accent: #39d353;
      --accent-strong: #6fffa0;
      --border: #1c3626;
      --mono: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace;
      --sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Fundo: chuva de caracteres + brilho radial */
    #rain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.35;
    }

    .glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(60vmax 60vmax at 50% 35%, rgba(57, 211, 83, 0.10), transparent 60%),
        linear-gradient(to bottom, rgba(5, 11, 6, 0.2), rgba(5, 11, 6, 0.85));
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 16px 32px;
    }

    .hero {
      width: 100%;
      max-width: 560px;
      text-align: center;
      animation: rise 0.8s ease-out both;
    }

    h1 {
      margin: 0;
      font-family: var(--mono);
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -1px;
      color: var(--accent-strong);
      text-shadow: 0 0 18px rgba(111, 255, 160, 0.35);
    }

    .role {
      margin: 12px 0 0;
      font-family: var(--mono);
      font-size: 0.95rem;
      color: var(--accent);
    }

    /* Carrossel de frases: todas na mesma célula do grid, então a altura não pula */
    .quotes {
      display: grid;
      margin: 20px auto 0;
      max-width: 44ch;
    }

    .quote {
      grid-area: 1 / 1;
      margin: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s, visibility 0.6s;
    }

    .quote.is-active {
      opacity: 1;
      visibility: visible;
    }

    .quote blockquote {
      margin: 0;
      color: var(--muted);
      font-style: italic;
    }

    .quote figcaption {
      margin-top: 6px;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--accent);
    }

    .quote-dots {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 10px;
    }

    .quote-dots button {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      cursor: pointer;
    }

    .quote-dots button::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.2s, box-shadow 0.2s;
    }

    .quote-dots button[aria-current="true"]::before {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(57, 211, 83, 0.6);
    }

    .quote-dots button:hover::before { background: var(--accent-strong); }

    .quote-dots button:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 0;
    }

    .prompt {
      margin: 18px 0 0;
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--accent);
    }

    .prompt .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.1em;
      margin-left: 2px;
      vertical-align: -0.2em;
      background: var(--accent);
      animation: blink 1.1s steps(1) infinite;
    }

    /* Links */
    .links {
      display: grid;
      gap: 14px;
      margin: 40px 0 0;
      padding: 0;
      list-style: none;
      text-align: left;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg-raised);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .card:hover,
    .card:focus-visible {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(57, 211, 83, 0.15);
      outline: none;
    }

    .card .icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(57, 211, 83, 0.08);
      border: 1px solid var(--border);
    }

    .card .icon svg { width: 26px; height: 26px; }

    .card .label { flex: 1; min-width: 0; }

    .card .title {
      display: block;
      font-family: var(--mono);
      font-weight: 700;
      color: var(--accent-strong);
    }

    .card .desc {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .card .arrow {
      flex: none;
      font-family: var(--mono);
      color: var(--accent);
      transition: transform 0.2s;
    }

    .card:hover .arrow { transform: translateX(4px); }

    /* Ícones sociais */
    .social {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 28px 0 0;
      padding: 0;
      list-style: none;
    }

    .social a {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--bg-raised);
      color: var(--muted);
      transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .social a:hover,
    .social a:focus-visible {
      color: var(--accent-strong);
      border-color: var(--accent);
      box-shadow: 0 0 16px rgba(57, 211, 83, 0.3);
      outline: none;
    }

    .social svg { width: 20px; height: 20px; fill: currentColor; }

    footer {
      margin-top: 48px;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: #3f6b4d;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #rain { display: none; }
    }
  </style>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Carrossel de frases: troca sozinho a cada 7s e pausa com mouse ou foco em cima
    (function () {
      var carousel = document.querySelector(".carousel");
      var quotes = carousel.querySelectorAll(".quote");
      var dots = carousel.querySelector(".quote-dots");
      var auto = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var current = 0;
      var timer = null;

      quotes.forEach(function (quote, i) {
        var dot = document.createElement("button");
        dot.type = "button";
        dot.setAttribute("aria-label", "Frase " + (i + 1));
        dot.addEventListener("click", function () { show(i); });
        dots.appendChild(dot);
      });
      dots.children[0].setAttribute("aria-current", "true");

      function show(i) {
        quotes[current].classList.remove("is-active");
        dots.children[current].removeAttribute("aria-current");
        current = i;
        quotes[current].classList.add("is-active");
        dots.children[current].setAttribute("aria-current", "true");
      }

      function start() {
        if (!auto || timer) return;
        timer = setInterval(function () { show((current + 1) % quotes.length); }, 7000);
      }

      function stop() {
        clearInterval(timer);
        timer = null;
      }

      carousel.addEventListener("mouseenter", stop);
      carousel.addEventListener("mouseleave", start);
      carousel.addEventListener("focusin", stop);
      carousel.addEventListener("focusout", start);
      start();
    })();

    // Chuva de caracteres no fundo (desligada com prefers-reduced-motion)
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      var canvas = document.getElementById("rain");
      var ctx = canvas.getContext("2d");
      var chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789{}<>/=;$".split("");
      var size = 16;
      var columns, drops;

      function resize() {
        var dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        columns = Math.ceil(window.innerWidth / size);
        drops = Array.from({ length: columns }, function () {
          return Math.random() * -window.innerHeight / size;
        });
      }

      function draw() {
        ctx.fillStyle = "rgba(5, 11, 6, 0.12)";
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
        ctx.font = size + "px 'JetBrains Mono', monospace";

        for (var i = 0; i < columns; i++) {
          var ch = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillStyle = Math.random() > 0.97 ? "#6fffa0" : "#1f7a35";
          ctx.fillText(ch, i * size, drops[i] * size);
          if (drops[i] * size > window.innerHeight && Math.random() > 0.975) drops[i] = 0;
          drops[i] += 0.5;
        }
      }

      resize();
      window.addEventListener("resize", resize);

      var last = 0;
      (function loop(t) {
        if (t - last > 50) { draw(); last = t; }
        requestAnimationFrame(loop);
      })(0);
    })();
  </script>
